<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B1F2B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>مخزون المحل</title>
<style>
:root{--ink:#3B1F2B;--paper:#FFF4F8;--rose:#C93F6B;--line:#E7CFD8;--band:#2F6DB5;--ok:#4F7A3A;--warn:#B8691C;--mute:#8A6C78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif;font-size:17px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}
header small{opacity:.75;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:#fff;border-bottom:1px solid var(--line)}
.chips button{background:var(--t);color:var(--c);border:2px solid var(--c);border-radius:14px;padding:10px 2px 6px;font-size:14px;font-weight:800;line-height:1.25;min-height:62px}
.chips button.on{background:var(--c);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.chips i{display:block;font-style:normal;font-size:13px;min-height:18px}
.band{background:var(--c);color:#fff;padding:10px 16px;font-weight:800;font-size:18px}
.tools{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
.tools input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper)}
.tools button{border:1.5px solid var(--ink);background:#fff;border-radius:10px;padding:0 12px;font-size:14px;font-weight:600}
.tools button.on{background:var(--ink);color:#fff}
.res-wrap{padding-top:4px}
#list{padding:12px 12px 2px}
.row{display:flex;align-items:center;min-height:68px;margin-bottom:10px;border-radius:16px;border:2px solid var(--t);border-inline-start:9px solid var(--c);background:#fff}
.row .nm{flex:1;padding:8px 14px;font-weight:700;font-size:18px}
.row.on{background:var(--t);border-color:var(--c)}
.row.on .nm{color:var(--c);font-weight:800}
.st{padding:8px 10px}

.st input{width:92px;height:50px;text-align:center;border:2px solid var(--c);border-radius:12px;background:#fff;font-size:24px;font-weight:800;color:var(--c);padding:0}
.st input::placeholder{color:#c9b3bd;font-weight:600}
.row .mid{flex:1;min-width:0;display:grid;padding:6px 14px 4px}
.row .mid .nm{padding:4px 0 0}
.nt{border:0;border-bottom:1.5px dashed var(--t);background:transparent;font-size:15px;padding:3px 0 5px;color:var(--ink);width:100%}
.row.on .nt{border-bottom-color:var(--c)}
.nt::placeholder{color:#b9a3ad}
.del{margin-inline:12px;border:1.5px solid var(--rose);color:var(--rose);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600}
.empty{padding:28px 16px;color:var(--mute);text-align:center}
.act{display:flex;gap:8px;padding:14px 16px;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.rose{background:var(--rose)}
.btn.full{width:100%}
.daybar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.daybar input{border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--paper)}
.daybar span{flex:1;font-weight:700}
form.f{padding:14px 16px;display:grid;gap:10px;background:#fff;border-bottom:1px solid var(--line)}
form.f label{display:grid;gap:4px;font-size:14px;color:var(--mute);font-weight:600}
form.f input,form.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{margin:0 12px 10px;padding:12px 14px;border-radius:16px;border:2px solid var(--st);border-inline-start:9px solid var(--st);background:#fff;display:grid;gap:6px;--st:#D43F7C}
.res.s0{--st:#D43F7C;background:#FFF0F5}.res.s1{--st:#D9731F;background:#FFF4E8}.res.s2{--st:#2E9467;background:#EDFAF3}.res.s3{--st:#999;background:#f4f4f4;opacity:.7}
.res h3{margin:0;font-size:17px}
.res p{margin:0;white-space:pre-wrap}
.res .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.res .late{color:var(--warn);font-weight:700}
.tag{display:inline-block;border-radius:8px;padding:1px 9px;font-size:13px;font-weight:800;background:var(--st);color:#fff}

.res .bt{display:flex;gap:8px}
.res .bt .btn{padding:8px 12px;font-size:15px}
pre.rp{margin:0;padding:16px;background:#fff;white-space:pre-wrap;font:inherit;border-bottom:1px solid var(--line)}
.pg{width:100%;display:block;margin-bottom:12px;border:1px solid var(--line);background:#fff;border-radius:8px}
.hint{padding:10px 16px;color:var(--mute);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{background:none;border:0;padding:11px 4px 10px;font-size:14px;color:var(--mute);font-weight:700;position:relative}
nav button.on{color:var(--ink);box-shadow:inset 0 4px 0 var(--k,var(--rose))}
nav button[data-t=need]{--k:#D43F7C}nav button[data-t=res]{--k:#D9731F}nav button[data-t=store]{--k:#17909C}nav button[data-t=rep]{--k:#2F6DB5}
nav b{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:var(--rose);color:#fff;font-size:12px;margin-inline-start:4px;padding:0 5px}
nav b:empty{display:none}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header><h1>مخزون المحل</h1><small id="date"></small></header>
<main id="main"></main>
<nav>
<button data-t="need">النواقص<b id="b-need"></b></button>
<button data-t="res">الحجوزات<b id="b-res"></b></button>
<button data-t="store">المخزن<b id="b-store"></b></button>
<button data-t="rep">التقرير</button>
</nav>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json" hidden>
<script>
const SEC=["الشرقي","الحوادق والدايت","النواعم","الغربي"];
const ITEMS={"الشرقي": ["شرقي سادة / كريمات", "شرقي وسط", "شرقي مكسرات", "فطيرة سادة وسط", "فطير مشلتت", "فطيرة كريمة مكسرات", "فطيرة جبنة وخضار كبيرة", "بغاشة سكر / بلح", "سوشي مانجو / نوتيلا", "كب كنافة مانجو / نوتيلا / بلح", "كيكة دبي"], "الحوادق والدايت": ["بقسماط سمسم", "بقسماط سادة", "بقسماط دايت", "محلب", "شيبسي جبنة", "شيبسي شوفان", "باتون سالية", "ساليزون مشكل", "بالمية", "كوكيز دايت عبوة", "منين دايت عبوة", "فايش شوفان", "فايش", "فريسكا سكر", "فريسكا زبيب", "فريسكا بيض", "رغيف عيش سن طري", "كرواسون صغير", "توست سن دايت", "عيش سن", "برازق دايت", "ميني ساليزون"], "النواعم": ["بسكويت نشادر", "بسكويت زبدة", "بسكويت ينسون", "بسكويت جوز هند", "بسكويت سمسم", "بسكويت شيكولاتة", "بسكويت زبدة قرفة", "بسكويت شوفان عبوة", "بسكويت شيكولاتة لوز", "بسكويت برتقال", "بسكويت فسدق", "سابلية فانيليا", "سابلية قرفة", "سابلية شيكولاتة", "سابلية فورم", "سابلية لوكس", "سابلية كريسماس", "كوكيز شيكولاتة", "كوكيز فانيليا", "بيتي فور بندق", "بيتي فور", "غريبة", "غريبة سادة", "كحك عجمية", "كحك عين جمل", "كحك بندق", "كحك فسدق", "كحك سادة", "كحك نباتي", "معمول عجوة", "قرص عجوة", "قرص عجمية", "قرص جبنة", "قرص سادة", "قرص رايب", "قرص عجمية قرفة", "قرص عجوة طري", "سويسرول سكر", "بوريك جبنة", "أصابع عجوة", "منين عجوة", "منين سادة", "منين سمسم", "منين زبدة", "كيك فانيليا", "كيك شيكولاتة", "كيك برتقال", "محوجة", "محوجة بالعسل", "كوفي دارك", "برازق", "بسكويت شيكولاتة بني"], "الغربي": ["تورتة 10*10", "تورتة م 16", "تورتة م 20", "تورتة م 20*20", "تورتة م 20*30", "تورتة م 30", "تورتة م 30 مربع", "تورتة م 30*40", "تورتة 40*40", "تورتة 40*60", "تورتة م 40*60 اسبيشيال", "تورتة م 24", "تورتة م 26 هاف/ فور", "تورتة م 26 مربع", "تورتة م 28", "تورتة م 24 مربع/ 8 قطع", "تورتة 28 مربع", "تورتة م 26 4/12/8", "تورتة دمعة", "جاتوه عادي", "كب كيك سادة", "كب كيك اسبيشيال", "جاتوه اسبيشيال", "ميلفاي", "بروفيترول", "دونتس", "ترايفل", "ديمباسيتو وسط", "عبوة كاستر", "قشطوطة", "علبة سوارية * 1 ك", "تارت", "علبة سوارية * 1.5 ك", "ميني سواريه", "ديسباسيتو صغير", "تشيز كيك/ فادج", "تورتة 24 ملفاي", "تورتة 26 ملفاي", "تورتة 28 ملفاي", "باباظ", "تورتة براونيز"]};
const STORE0=["علب تورتة","علب بسكويت","شنط بلاستيك","قماش تورتة"];
const ST=["جديد","مُرسَل للمصنع","وصل من المصنع","سُلّم للعميل"];
const NEXT=["أرسلته للمصنع","وصل من المصنع","سُلّم للعميل","إعادة فتح"];
const KEY="mk2";
const SC={"الشرقي":["#D9731F","#FFE8D2"],"الحوادق والدايت":["#2E9467","#D8F3E5"],"النواعم":["#D43F7C","#FFDDEA"],"الغربي":["#6A4BC4","#E6DEFA"],store:["#17909C","#D6F1F4"],def:["#C93F6B","#FFE3EC"]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>Math.max(0,parseInt(String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)))||0);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.items)return v}catch(e){}
  return{items:JSON.parse(JSON.stringify(ITEMS)),days:{},res:[],store:STORE0.map(n=>({n,q:0}))}}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("تعذر الحفظ: مساحة المتصفح ممتلئة")}};
let tab="need",sec=SEC[0],q="",edit=false,day=today(),showForm=false,showDone=false;
const dq=(s,n)=>(S.days[day]&&S.days[day][s+"|"+n])||0;
function setNeed(s,n,v){const d=S.days[day]||(S.days[day]={});if(v>0)d[s+"|"+n]=v;else delete d[s+"|"+n];if(!Object.keys(d).length)delete S.days[day]}
const BR=()=>S.branch===undefined?"فرع الترعة":S.branch;
const getNote=(s,n)=>((S.notes||{})[day]||{})[s+"|"+n]||"";
function setNote(s,n,v){S.notes=S.notes||{};const d=S.notes[day]||(S.notes[day]={}),k=s+"|"+n;if(v.trim())d[k]=v;else delete d[k];if(!Object.keys(d).length)delete S.notes[day]}
function setTitle(){const t=BR().trim()||"مخزون المحل";document.querySelector("header h1").textContent=t;document.title=t+" - مخزون المحل"}
const cnt=s=>Object.keys(S.days[day]||{}).filter(k=>k.startsWith(s+"|")).length;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
function badges(){
  $("#b-need").textContent=Object.keys(S.days[day]||{}).length||"";
  $("#b-res").textContent=S.res.filter(r=>r.st<3).length||"";
  $("#b-store").textContent=S.store.filter(o=>o.q>0).length||"";
  document.querySelectorAll(".chips button[data-sec]").forEach(b=>{b.querySelector("i").textContent=cnt(b.dataset.sec)||""});
}
function render(){
  $("#date").textContent=fmt(day);setTitle();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const m=$("#main");
  const C=tab==="need"?SC[sec]:tab==="store"?SC.store:SC.def;m.style.setProperty("--c",C[0]);m.style.setProperty("--t",C[1]);
  if(tab==="need"){
    m.innerHTML=`<div class="daybar"><span>تاريخ الأوردر</span><input type="date" id="dt" value="${day}"><button class="btn alt" data-a="today" style="padding:6px 12px">اليوم</button></div>
    <div class="daybar"><span style="flex:none">المسؤول</span><input id="mg" placeholder="اسم المسؤول" value="${esc(S.mgr||"")}" style="flex:1;min-width:0"></div>
    <div class="chips">${SEC.map(s=>`<button data-sec="${esc(s)}" style="--c:${SC[s][0]};--t:${SC[s][1]}" class="${s===sec?"on":""}">${esc(s)}<i></i></button>`).join("")}</div>
    <div class="tools"><input id="q" type="search" placeholder="ابحث عن صنف" value="${esc(q)}"><button data-a="edit" class="${edit?"on":""}">تعديل القائمة</button></div>
    <div id="list"></div>
    <div class="act"><button class="btn alt" data-a="additem">+ إضافة صنف جديد</button></div>`;
    renderList();
  } else if(tab==="store"){
    m.innerHTML=`<div class="band">احتياجات المحل من المستلزمات</div>
    <div class="tools"><span style="flex:1;align-self:center;color:var(--mute);font-size:14px">اكتب العدد المطلوب لكل بند</span><button data-a="edit" class="${edit?"on":""}">تعديل القائمة</button></div>
    <div id="list"></div>
    <div class="act"><button class="btn alt" data-a="additem">+ إضافة بند</button><button class="btn alt" data-a="clearstore">تم الطلب: صفّر الكل</button></div>`;
    renderList();
  } else if(tab==="res"){
    const done=S.res.filter(r=>r.st===3).length;
    const list=S.res.slice().sort((a,b)=>(a.st===3)-(b.st===3)||(a.dt||"9").localeCompare(b.dt||"9")).filter(r=>showDone||r.st<3);
    m.innerHTML=`<div class="act"><button class="btn rose full" data-a="rform">${showForm?"إلغاء":"+ حجز جديد"}</button></div>
    ${showForm?`<form class="f" id="rf"><div class="g2"><label>اسم العميل<input name="c" autocomplete="off"></label><label>الهاتف<input name="p" inputmode="tel"></label></div>
    <label>الطلب (الصنف والكمية)<textarea name="d" rows="3" required></textarea></label>
    <label>موعد التسليم<input type="date" name="dt" value="${today()}"></label>
    <button class="btn" type="submit">حفظ الحجز</button></form>`:""}
    ${list.map(r=>{const late=r.dt&&r.dt<today()&&r.st<3;return`<div class="res s${r.st}" data-id="${r.id}">
      <h3>${esc(r.c||"بدون اسم")} <span class="tag t${r.st}">${ST[r.st]}</span></h3>
      <p>${esc(r.d)}</p>
      <div class="meta">${r.dt?`<span class="${late?"late":""}">التسليم: ${fmt(r.dt)}${late?" (متأخر)":""}</span>`:""}${r.p?`<a href="tel:${esc(r.p)}">${esc(r.p)}</a>`:""}</div>
      <div class="bt"><button class="btn" data-a="next">${NEXT[r.st]}</button><button class="btn alt" data-a="rdel">حذف</button></div></div>`}).join("")||`<p class="empty">لا توجد حجوزات مفتوحة.</p>`}
    ${done?`<div class="act"><button class="btn alt full" data-a="done">${showDone?"إخفاء":"إظهار"} المسلَّمة (${done})</button></div>`:""}`;
  } else {
    const t=report();const md=S.repMode||"all";
    m.innerHTML=`<div class="tools"><input id="br" placeholder="اسم الفرع" value="${esc(BR())}"><input id="mg" placeholder="اسم المسؤول" value="${esc(S.mgr||"")}"></div>
    <div class="chips" style="grid-template-columns:1fr 1fr">${[["all","كل الأصناف"],["need","الناقص فقط"]].map(([k,l])=>`<button data-a="rmode" data-m="${k}" class="${md===k?"on":""}" style="--c:#2F6DB5;--t:#DCE9F8;min-height:48px;padding:10px">${l}</button>`).join("")}</div>
    <div id="pv" style="padding:12px"></div>
    <div class="act"><button class="btn rose" data-a="shareimg">مشاركة الصور</button><button class="btn alt" data-a="saveimg">حفظ الصور</button></div>
    <div class="band" style="background:var(--ink)">نص التقرير</div>
    <pre class="rp" id="rt">${esc(t)}</pre>
    <div class="act"><button class="btn" data-a="copy">نسخ النص</button><button class="btn alt" data-a="wa">إرسال النص واتساب</button></div>
    <div class="hint">النسخ الاحتياطي يحفظ كل الأصناف والحجوزات في ملف. البيانات محفوظة على هذا الجهاز فقط، فاحتفظ بنسخة من وقت لآخر.</div>
    <div class="act"><button class="btn alt" data-a="backup">حفظ نسخة احتياطية</button><button class="btn alt" data-a="restore">استرجاع نسخة</button><button class="btn alt" data-a="clearday">مسح نواقص هذا اليوم</button></div>`;
    drawPreviews();
  }
  badges();
}
function renderList(){
  const el=$("#list");if(!el)return;
  const isNeed=tab==="need";
  const arr=isNeed?S.items[sec].map(n=>({n,v:dq(sec,n),nt:getNote(sec,n)})):S.store.map(o=>({n:o.n,v:o.q,nt:o.note||""}));
  const t=q.trim();
  const html=arr.map((o,i)=>({...o,i})).filter(o=>isNeed?(!t||o.n.includes(t)):true).map(o=>
    `<div class="row${o.v?" on":""}" data-i="${o.i}">${edit?`<span class="nm">${esc(o.n)}</span><button class="del" data-a="del">حذف</button>`:
    `<div class="mid"><span class="nm">${esc(o.n)}</span><input class="nt" placeholder="ملاحظة…" value="${esc(o.nt)}" aria-label="ملاحظة ${esc(o.n)}" enterkeyhint="done"></div><div class="st"><input inputmode="numeric" enterkeyhint="next" value="${o.v||""}" placeholder="0" aria-label="الكمية"></div>`}</div>`).join("");
  el.innerHTML=html||`<p class="empty">${t?"لا يوجد صنف بهذا الاسم.":"القائمة فارغة. أضف أول بند."}</p>`;
}
function report(){
  const L=[`📋 ${BR().trim()||"مخزون المحل"} — ${fmt(day)}`];if(S.mgr)L.push(`المسؤول: ${S.mgr}`);
  L.push(`عدد الأصناف الناقصة: ${Object.keys(S.days[day]||{}).length}`);let any=false;
  SEC.forEach(s=>{const r=S.items[s].filter(n=>dq(s,n)>0||getNote(s,n));if(r.length){any=true;L.push("",`【 قسم ${s} 】`);r.forEach(n=>{const v=dq(s,n),nt=getNote(s,n);L.push(`• ${n}${v?`: ${v}`:""}${nt?` (${nt})`:""}`)})}});
  const rs=S.res.filter(r=>r.st<2).sort((a,b)=>(a.dt||"9").localeCompare(b.dt||"9"));
  if(rs.length){any=true;L.push("","【 حجوزات للمصنع 】");rs.forEach(r=>L.push(`• ${r.c||"بدون اسم"} — ${r.d.replace(/\n/g," / ")}${r.dt?` (تسليم ${fmt(r.dt)})`:""} [${ST[r.st]}]`))}
  const st=S.store.filter(o=>o.q>0||o.note);
  if(st.length){any=true;L.push("","【 احتياجات المخزن 】");st.forEach(o=>L.push(`• ${o.n}${o.q?`: ${o.q}`:""}${o.note?` (${o.note})`:""}`))}
  if(!any)L.push("","لا توجد نواقص أو حجوزات أو احتياجات مسجلة.");
  return L.join("\n");
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();return Promise.resolve();
}
const FONT='"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif';
let PG=[];
const sdate=d=>new Date(d+"T12:00:00").toLocaleDateString('ar-EG',{day:'numeric',month:'numeric',year:'numeric'});
const wday=d=>new Date(d+"T12:00:00").toLocaleDateString('ar-EG',{weekday:'long'});
function wrapTxt(ctx,t,w){const ws=t.split(/\s+/),out=[];let cur="";for(const x of ws){const n=cur?cur+" "+x:x;if(ctx.measureText(n).width>w&&cur){out.push(cur);cur=x}else cur=n}if(cur)out.push(cur);return out}
function fitFont(ctx,t,w,px,wt){let s=px;for(;;){ctx.font=`${wt} ${s}px ${FONT}`;if(ctx.measureText(t).width<=w||s<=16)break;s-=2}}
function clip(g,t,w){if(g.measureText(t).width<=w)return t;while(t.length>1&&g.measureText(t+"…").width>w)t=t.slice(0,-1);return t+"…"}
function drawSheet(secs,extra){
  const W=1080,M=24,GAP=16,colW=(W-2*M-GAP)/2,qW=130,RH=48,RN=76,HEAD=144,BAND=58,SUB=46,XB=58,XR=44,mode=S.repMode||"all";
  const mc=document.createElement("canvas").getContext("2d");mc.direction="rtl";mc.font=`24px ${FONT}`;
  const lists=secs.map(s=>S.items[s].map(n=>({n,v:dq(s,n),nt:getNote(s,n)})).filter(o=>mode==="all"||o.v>0||o.nt));
  const tableH=Math.max(8*RH,...lists.map(l=>l.reduce((a,o)=>a+(o.nt?RN:RH),0)));
  const xs=[];extra.lines.forEach(t=>wrapTxt(mc,t,W-2*M-40).forEach(l=>xs.push(l)));
  const xRows=Math.max(3,xs.length);
  const tableBottom=HEAD+BAND+SUB+tableH, H=tableBottom+24+XB+xRows*XR+M;
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const g=c.getContext("2d");g.direction="rtl";g.textBaseline="middle";
  const T=(t,x,y,font,col,al)=>{g.font=font;g.fillStyle=col;g.textAlign=al||"right";g.fillText(t,x,y)};
  g.fillStyle="#fff";g.fillRect(0,0,W,H);
  g.strokeStyle="#8d96a0";g.lineWidth=2;g.strokeRect(M,M,W-2*M,104);
  g.beginPath();g.moveTo(M,M+52);g.lineTo(W-M,M+52);g.moveTo(W/2,M);g.lineTo(W/2,M+104);g.stroke();
  const hf=`bold 26px ${FONT}`;
  T("اسم الفرع/ "+BR(),W-M-14,M+26,hf,"#222");
  T("التاريخ/ "+sdate(day),W/2-14,M+26,hf,"#222");
  T("اليوم/ "+wday(day),W-M-14,M+78,hf,"#222");
  T("المسؤول/ "+(S.mgr||""),W/2-14,M+78,hf,"#222");
  secs.forEach((s,k)=>{
    const xr=W-M-k*(colW+GAP),xl=xr-colW,[col,tint]=SC[s],y0=HEAD+BAND+SUB,nameW=colW-qW-28;
    g.fillStyle=col;g.fillRect(xl,HEAD,colW,BAND);
    T("قسم "+s,xl+colW/2,HEAD+BAND/2,`bold 28px ${FONT}`,"#fff","center");
    g.fillStyle=tint;g.fillRect(xl,HEAD+BAND,colW,SUB);
    T("الصنف",xr-14,HEAD+BAND+SUB/2,`bold 22px ${FONT}`,col);
    T("الكمية",xl+qW/2,HEAD+BAND+SUB/2,`bold 22px ${FONT}`,col,"center");
    let y=y0;
    const hline=yy=>{g.strokeStyle="#c9ced4";g.lineWidth=1;g.beginPath();g.moveTo(xl,yy);g.lineTo(xr,yy);g.stroke()};
    lists[k].forEach(o=>{
      const h=o.nt?RN:RH;
      if(o.v>0){g.fillStyle=tint;g.fillRect(xl,y,colW,h)}
      hline(y+h);
      fitFont(g,o.n,nameW,25,o.v>0?"bold":"normal");
      g.fillStyle=o.v>0?col:"#222";g.textAlign="right";g.fillText(o.n,xr-14,o.nt?y+26:y+h/2);
      if(o.nt){g.font=`21px ${FONT}`;g.fillStyle="#555";g.fillText(clip(g,o.nt,nameW),xr-14,y+54)}
      if(o.v>0)T(String(o.v),xl+qW/2,y+h/2,`bold 30px ${FONT}`,col,"center");
      y+=h;
    });
    while(y<y0+tableH){const h=Math.min(RH,y0+tableH-y);hline(y+h);y+=h}
    g.strokeStyle="#8d96a0";g.lineWidth=2;g.strokeRect(xl,HEAD+BAND,colW,SUB+tableH);
    g.beginPath();g.moveTo(xl+qW,HEAD+BAND);g.lineTo(xl+qW,tableBottom);g.stroke();
  });
  const y=tableBottom+24;
  g.fillStyle=extra.color;g.fillRect(M,y,W-2*M,XB);
  T(extra.title,W/2,y+XB/2,`bold 30px ${FONT}`,"#fff","center");
  for(let i=0;i<xRows;i++){
    const yy=y+XB+i*XR;
    g.strokeStyle="#c9ced4";g.lineWidth=1;g.beginPath();g.moveTo(M,yy+XR);g.lineTo(W-M,yy+XR);g.stroke();
    if(xs[i])T(xs[i],W-M-20,yy+XR/2,`24px ${FONT}`,"#222");
  }
  g.strokeStyle="#8d96a0";g.lineWidth=2;g.strokeRect(M,y+XB,W-2*M,xRows*XR);
  return c;
}
function resLines(){return S.res.filter(r=>r.st<2).sort((a,b)=>(a.dt||"9").localeCompare(b.dt||"9")).map(r=>`${r.c||"بدون اسم"} — ${r.d.replace(/\n/g," / ")}${r.dt?` — ${new Date(r.dt+"T12:00:00").toLocaleDateString('ar-EG',{day:'numeric',month:'numeric'})}`:""}`)}
function drawPreviews(){
  const pv=$("#pv");if(!pv)return;
  try{
    PG=[drawSheet(["الشرقي","الحوادق والدايت"],{title:"الحجز",color:"#D9435E",lines:resLines()}),
        drawSheet(["النواعم","الغربي"],{title:"المخزن",color:SC.store[0],lines:S.store.filter(o=>o.q>0||o.note).map(o=>`${o.n}${o.q?`: ${o.q}`:""}${o.note?` (${o.note})`:""}`)})];
    pv.innerHTML="";
    PG.forEach((c,i)=>{const im=new Image();im.src=c.toDataURL("image/png");im.alt="صفحة "+(i+1);im.className="pg";pv.appendChild(im)});
  }catch(e){pv.innerHTML='<p class="empty">تعذر إنشاء الصورة على هذا المتصفح.</p>'}
}
const toBlob=c=>new Promise(r=>c.toBlob(r,"image/png"));
async function getFiles(){const f=[];for(let i=0;i<PG.length;i++)f.push(new File([await toBlob(PG[i])],`مخزون-${day}-${i+1}.png`,{type:"image/png"}));return f}
function saveFiles(files){files.forEach((f,i)=>setTimeout(()=>{const u=URL.createObjectURL(f);const a=document.createElement("a");a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)},i*500))}
async function shareImgs(){
  const files=await getFiles();
  if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,title:"نواقص "+sdate(day)})}catch(e){}}
  else{saveFiles(files);toast("تم حفظ الصور في الجهاز")}
}
const main=$("#main");
main.addEventListener("click",e=>{
  const nm=e.target.closest(".row .nm");if(nm){const i=nm.closest(".row").querySelector(".st input");if(i)i.focus();return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.sec){sec=b.dataset.sec;q="";edit=false;render();return}
  const a=b.dataset.a;if(!a)return;
  const row=b.closest("[data-i]");
  if(a==="today"){day=today();render()}
  else if(a==="edit"){edit=!edit;render()}
  else if(a==="additem"){
    const n=(prompt(tab==="need"?`اسم الصنف الجديد في قسم ${sec}`:"اسم البند الجديد")||"").trim();if(!n)return;
    if(tab==="need"){if(S.items[sec].includes(n))return toast("الصنف موجود بالفعل");S.items[sec].push(n)}
    else{if(S.store.some(o=>o.n===n))return toast("البند موجود بالفعل");S.store.push({n,q:0})}
    save();renderList();toast("تمت الإضافة");
  }
  else if(a==="del"){
    const i=+row.dataset.i;const n=tab==="need"?S.items[sec][i]:S.store[i].n;
    if(!confirm(`حذف "${n}" من القائمة؟`))return;
    if(tab==="need")S.items[sec].splice(i,1);else S.store.splice(i,1);
    save();renderList();badges();
  }
  else if(a==="clearstore"){if(confirm("تصفير كل كميات المخزن بعد الطلب؟")){S.store.forEach(o=>o.q=0);save();render()}}
  else if(a==="rform"){showForm=!showForm;render()}
  else if(a==="done"){showDone=!showDone;render()}
  else if(a==="next"||a==="rdel"){
    const r=S.res.find(x=>x.id==b.closest("[data-id]").dataset.id);if(!r)return;
    if(a==="next")r.st=(r.st+1)%4;
    else{if(!confirm("حذف هذا الحجز؟"))return;S.res=S.res.filter(x=>x!==r)}
    save();render();
  }
  else if(a==="rmode"){S.repMode=b.dataset.m;save();render()}
  else if(a==="shareimg")shareImgs();
  else if(a==="saveimg")getFiles().then(f=>{saveFiles(f);toast("تم حفظ الصور في الجهاز")});
  else if(a==="copy")copyText($("#rt").textContent).then(()=>toast("تم النسخ"));
  else if(a==="wa")window.open("https://wa.me/?text="+encodeURIComponent($("#rt").textContent),"_blank");
  else if(a==="clearday"){if(confirm("مسح كل نواقص هذا اليوم؟")){delete S.days[day];if(S.notes)delete S.notes[day];save();render()}}
  else if(a==="backup"){
    const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
    const l=document.createElement("a");l.href=u;l.download=`مخزون-المحل-${today()}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
  }
  else if(a==="restore")$("#file").click();
});
main.addEventListener("change",e=>{
  if(e.target.id==="dt"){day=e.target.value||today();render();return}
  if(e.target.matches(".st input"))commit(e.target,true);
});
function commit(inp,norm){
  const row=inp.closest("[data-i]");const i=+row.dataset.i;const v=num(inp.value);
  if(tab==="need")setNeed(sec,S.items[sec][i],v);else S.store[i].q=v;
  save();row.classList.toggle("on",v>0);if(norm)inp.value=v||"";badges();
}
main.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;renderList()}
  else if(e.target.matches(".st input"))commit(e.target,false);
  else if(e.target.matches(".nt")){
    const i=+e.target.closest("[data-i]").dataset.i;
    if(tab==="need")setNote(sec,S.items[sec][i],e.target.value);else S.store[i].note=e.target.value;save();
  }
  else if(e.target.id==="br"||e.target.id==="mg"){
    if(e.target.id==="br"){S.branch=e.target.value;setTitle()}else S.mgr=e.target.value;
    save();clearTimeout(window._bt);window._bt=setTimeout(drawPreviews,300);
  }
});
main.addEventListener("focusin",e=>{if(e.target.matches(".st input"))setTimeout(()=>e.target.select(),0)});
main.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches(".nt")){e.preventDefault();e.target.blur();return}
  if(e.key==="Enter"&&e.target.matches(".st input")){e.preventDefault();
    const all=[...document.querySelectorAll("#list .st input")];const n=all[all.indexOf(e.target)+1];
    if(n){n.focus();n.scrollIntoView({block:"center",behavior:"smooth"})}else e.target.blur()}
});
main.addEventListener("submit",e=>{
  e.preventDefault();const f=new FormData(e.target);const d=(f.get("d")||"").trim();if(!d)return;
  S.res.push({id:Date.now(),c:(f.get("c")||"").trim(),p:(f.get("p")||"").trim(),d,dt:f.get("dt")||"",st:0});
  save();showForm=false;render();toast("تم حفظ الحجز");
});
$("#file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const v=JSON.parse(r.result);if(!v.items||!v.days||!v.res||!v.store)throw 0;
    if(confirm("استبدال البيانات الحالية بالنسخة المحفوظة؟")){S=v;save();render();toast("تم الاسترجاع")}}catch(x){toast("الملف غير صالح")}};
  r.readAsText(f);e.target.value="";
});
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;edit=false;showForm=false;render();scrollTo(0,0)});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
